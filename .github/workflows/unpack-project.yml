name: Expand IMovies starter project
on:
  push:
    paths:
      - ".github/workflows/unpack-project.yml"
permissions:
  contents: write
jobs:
  expand-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand encoded project archive
        shell: bash
        run: |
          set -euo pipefail
          cat project-archive/part-*.b64 > project.zip.b64
          base64 --decode project.zip.b64 > project.zip
          unzip -t project.zip
          unzip -oq project.zip -d .
          rm -rf project-archive project.zip project.zip.b64
      - name: Commit project source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add full IMovies MERN application"
          git push
